# fly.toml app configuration file generated for steam-deck-notifier on 2026-08-07T18:09:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "steam-deck-notifier"
primary_region = "iad"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
