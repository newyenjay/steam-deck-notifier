<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steam Deck Notifier Status</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #111827;
        color: #f9fafb;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .card {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .status-grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .pill {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: bold;
      }
      .pill.true {
        background: #14532d;
        color: #dcfce7;
      }
      .pill.false {
        background: #7f1d1d;
        color: #fee2e2;
      }
      .pill.unknown {
        background: #44403c;
        color: #f5f5f4;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.55rem 0.8rem;
        border-radius: 999px;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      .status-badge.ok {
        background: #14532d;
        color: #dcfce7;
      }
      .status-badge.warn {
        background: #92400e;
        color: #fef3c7;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th,
      td {
        border-bottom: 1px solid #374151;
        padding: 0.7rem;
        text-align: left;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Steam Deck Notifier</h1>
    <p>Live status from the latest API checks.</p>
    <div id="lastUpdated" style="color:#cbd5e1;margin-top:0.25rem;margin-bottom:0.5rem;">Last updated: —</div>
    <div id="summary" class="card"></div>
    <div id="results" class="status-grid"></div>
    <div class="card">
      <h2>Check history</h2>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.5rem;">
        <label style="color:#cbd5e1;">Filter:</label>
        <select id="filterSelect">
          <option value="all">All</option>
          <option value="available">Available</option>
          <option value="unavailable">Unavailable</option>
          <option value="unknown">Unknown</option>
        </select>

        <label style="color:#cbd5e1;margin-left:0.75rem;">Sort by:</label>
        <select id="sortSelect">
          <option value="timestamp">Timestamp</option>
          <option value="version">Model</option>
          <option value="package_id">Package ID</option>
          <option value="display_type">Display</option>
          <option value="available">Available</option>
        </select>
        <select id="sortDirSelect">
          <option value="desc">Desc</option>
          <option value="asc">Asc</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Model</th>
            <th>Package ID</th>
            <th>Display</th>
            <th>Available</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
      <div id="pagination" style="display:flex;gap:0.5rem;align-items:center;margin-top:0.75rem;">
        <button id="prevBtn">Prev</button>
        <span id="pageInfo" style="min-width:140px;display:inline-block;text-align:center;color:#cbd5e1;"></span>
        <button id="nextBtn">Next</button>
      </div>
    </div>
    <script>
      let autoRefreshTimer = null;
      let historyItems = [];
      let currentPage = 1;
      const pageSize = 5;
      let sortBy = 'timestamp';
      let sortDir = 'desc';
      let filterBy = 'all';

      function formatTimestamp(ts) {
        if (!ts) return "n/a";
        try {
          // Ensure the string is parsed as UTC when needed
          const parseable = String(ts).includes("UTC") ? String(ts) : `${ts} UTC`;
          const d = new Date(parseable);
          const opts = {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            timeZoneName: "short",
          };
          return new Intl.DateTimeFormat("en-CA", Object.assign({ timeZone: "America/Edmonton" }, opts)).format(d);
        } catch (e) {
          return ts;
        }
      }

      function renderStatusBadge(summaryData, lastSuccessfulCheck) {
        const summary = document.getElementById("summary");
        const badgeClass = lastSuccessfulCheck ? "ok" : "warn";
        const badgeText = lastSuccessfulCheck
          ? `Last successful check: ${formatTimestamp(lastSuccessfulCheck)}`
          : "No successful check yet";
        summary.innerHTML = `
          <div class="status-badge ${badgeClass}">● ${badgeText}</div>
          <div><strong>Country:</strong> ${summaryData.country_code}</div>
          <div><strong>Last checked:</strong> ${formatTimestamp(summaryData.checked_at)}</div>
        `;
      }

      async function loadData() {
        const results = document.getElementById("results");
        const historyBody = document.getElementById("historyBody");

        const refreshRes = await fetch("/api/refresh");
        const refreshData = await refreshRes.json();

        const historyRes = await fetch("/api/history");
        const historyData = await historyRes.json();

        const successfulChecks = historyData.filter(
          (item) =>
            item.available &&
            String(item.available).toLowerCase() !== "unknown",
        );
        const lastSuccessfulCheck = successfulChecks.length
          ? successfulChecks[successfulChecks.length - 1].timestamp
          : null;

        renderStatusBadge(refreshData, lastSuccessfulCheck);

        results.innerHTML = refreshData.results
          .map(
            (item) => `
          <div class="card">
            <h3>${item.version}GB ${item.display_type}</h3>
            <p>Package ID: ${item.package_id}</p>
            <span class="pill ${String(item.available).toLowerCase()}">${item.available}</span>
            <p>${formatTimestamp(item.checked_at)}</p>
          </div>
        `,
          )
          .join("");

        // Store history items and render the first page (most recent first)
        historyItems = historyData.slice().reverse();
        currentPage = 1;
        // apply current controls
        applyControlsFromUI();
        renderHistoryPage();

        // update last-updated timestamp to now (client time) in Calgary timezone
        try {
          const nowIso = new Date().toISOString();
          const lastEl = document.getElementById('lastUpdated');
          if (lastEl) lastEl.textContent = `Last updated: ${formatTimestamp(nowIso)}`;
        } catch (e) {
          // ignore
        }
      }

      function renderHistoryPage() {
        const historyBody = document.getElementById("historyBody");
        const pageInfo = document.getElementById("pageInfo");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        // Filter
        let filtered = historyItems.filter((item) => {
          if (filterBy === 'all') return true;
          const av = String(item.available).toLowerCase();
          if (filterBy === 'available') return av === 'true' || av === 'available' || av === 'yes';
          if (filterBy === 'unavailable') return av === 'false' || av === 'unavailable' || av === 'no';
          if (filterBy === 'unknown') return av === 'unknown' || av === '' || av === 'null' || av === 'none';
          return true;
        });

        // Sort
        const compare = (a, b) => {
          const getVal = (item) => {
            if (sortBy === 'timestamp') return Date.parse(item.timestamp) || 0;
            if (sortBy === 'version') return parseFloat(item.version) || 0;
            if (sortBy === 'package_id') return String(item.package_id || '').toLowerCase();
            if (sortBy === 'display_type') return String(item.display_type || '').toLowerCase();
            if (sortBy === 'available') return String(item.available || '').toLowerCase();
            return String(item[sortBy] || '').toLowerCase();
          };

          const va = getVal(a);
          const vb = getVal(b);
          if (typeof va === 'number' && typeof vb === 'number') return va - vb;
          if (va < vb) return -1;
          if (va > vb) return 1;
          return 0;
        };

        filtered.sort((a, b) => {
          const res = compare(a, b);
          return sortDir === 'asc' ? res : -res;
        });

        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const start = (currentPage - 1) * pageSize;
        const pageItems = filtered.slice(start, start + pageSize);

        historyBody.innerHTML = pageItems
          .map(
            (item) => `
          <tr>
            <td>${formatTimestamp(item.timestamp)}</td>
            <td>${item.version}GB</td>
            <td>${item.package_id}</td>
            <td>${item.display_type}</td>
            <td><span class="pill ${String(item.available).toLowerCase()}">${item.available}</span></td>
          </tr>
        `,
          )
          .join("");

        const showingFrom = total === 0 ? 0 : start + 1;
        const showingTo = start + pageItems.length;
        pageInfo.textContent = `Showing ${showingFrom}-${showingTo} of ${total} (${currentPage}/${totalPages})`;

        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
      }

      document.addEventListener("click", (ev) => {
        if (ev.target && ev.target.id === "prevBtn") {
          currentPage -= 1;
          renderHistoryPage();
        } else if (ev.target && ev.target.id === "nextBtn") {
          currentPage += 1;
          renderHistoryPage();
        }
      });

      // Wire up filter/sort controls
      function applyControlsFromUI() {
        const f = document.getElementById('filterSelect');
        const s = document.getElementById('sortSelect');
        const d = document.getElementById('sortDirSelect');
        if (f) filterBy = f.value;
        if (s) sortBy = s.value;
        if (d) sortDir = d.value;
      }

      document.getElementById('filterSelect').addEventListener('change', () => {
        applyControlsFromUI();
        currentPage = 1;
        renderHistoryPage();
      });
      document.getElementById('sortSelect').addEventListener('change', () => {
        applyControlsFromUI();
        currentPage = 1;
        renderHistoryPage();
      });
      document.getElementById('sortDirSelect').addEventListener('change', () => {
        applyControlsFromUI();
        currentPage = 1;
        renderHistoryPage();
      });

      function startAutoRefresh() {
        if (autoRefreshTimer) {
          clearInterval(autoRefreshTimer);
        }
        autoRefreshTimer = setInterval(loadData, 30000);
      }

      // Refresh button removed; page auto-refreshes every 30s.
      loadData();
      startAutoRefresh();
    </script>
  </body>
</html>
