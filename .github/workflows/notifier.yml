name: Steam Deck Notifier

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notifier
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USE_TLS: true
          SMTP_USER: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python notifier.py --run-once --country-code CA
